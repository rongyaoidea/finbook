name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 全量测试（workspace 单测 + findb 两端到端） ──────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace

  # ── lint（fincore/findb 零警告强制；UI 层允许既有 f32 警告但记录） ────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy（fincore/findb，检查但不强制零警告）
        run: cargo clippy -p fincore -p findb --all-targets -- -A clippy::too_many_arguments -A clippy::type_complexity -A clippy::large_enum_variant -A clippy::should_implement_trait -A clippy::field_reassign_with_default
      - name: clippy（全 workspace）
        run: cargo clippy --workspace --all-targets

  # ── release 构建产物（Linux x64） ─────────────────────────────────────
  build-linux:
    name: Build (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release
        run: cargo build --release -p finbook -p finweb
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: finbook-linux-x64
          path: |
            target/release/finbook
            target/release/finweb

  # ── release 构建产物（Windows x64，mingw 交叉编译） ──────────────────
  build-windows:
    name: Build (Windows x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: 安装 mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: 交叉编译 release
        run: cargo build --release --target x86_64-pc-windows-gnu -p finbook -p finweb
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: finbook-windows-x64
          path: |
            target/x86_64-pc-windows-gnu/release/finbook.exe
            target/x86_64-pc-windows-gnu/release/finweb.exe
