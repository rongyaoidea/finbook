name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 全量测试（workspace 单测 + findb 两端到端 + 前端工具函数） ────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace --locked
      - name: 前端工具函数测试（node:test）
        run: node --test crates/finweb/static/util.test.js
      # 语法检查 + 「同一函数内重复 id」检测，按退出码判定。
      # 重复 id 是合法 JS，语法检查抓不到，但后果是功能静默失效：
      # #pv-social 同时用作科目输入框和按钮 id，$("#pv-social") 只拿到前者，
      # 于是「生成社保缴纳凭证」按钮从未绑定 onclick——点了没反应、不报错，
      # 而对应端点的集成测试一直是绿的。
      - name: 前端静态检查（语法 + 重复 id + 行为约束 + nginx 锚点）
        run: node tools/check-js.js
      # CI 配置自检 + 变异清单是否过期。变异清单靠字面匹配源码，源码一改就可能
      # 对不上 —— 那样脚本会报「未生效」，守护的检查从此再没人验证，而 CI 全绿。
      - name: CI 配置与变异清单自检
        run: node tools/check-ci.js

  # ── 变异测试：验证上面那些检查/测试**不是永远通过的** ───────────────────
  #
  # 为什么要单独一个 job：静态检查与集成测试最大的失败模式是「写成永远通过的样子」
  # ——判据钉的是表象而不是机制，重构一下代码形状就悄悄失效，而 CI 全绿。
  # 本轮就有三条这样的检查被变异测试抓住（详见 DEPLOY.md 4.3）。
  #
  # 这不是"多跑一遍测试"，而是**反过来验证测试本身**：逐条把被守护的代码改坏，
  # 要求对应检查/测试必须报红。跑完自动还原源码。
  mutation:
    name: Mutation (checks must fail when code is broken)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 自检自身也要被验证（改坏 CI 配置与清单 → 必须报红）
        run: node tools/check-ci.js --selftest
      - name: 前端检查的变异（改坏 app.js → check-js 必须报错）
        run: node tools/mutate-check.js
      - name: 集成测试的变异（改坏 Rust → 对应测试必须失败）
        run: node tools/mutate-rust.js
      - name: 确认源码已还原（否则这条 job 自己就是个脏工作区）
        run: git diff --exit-code

  # ── lint（记录型：fincore/findb 收窄允许项；UI 层允许既有 f32 警告） ────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy（fincore/findb）
        run: cargo clippy -p fincore -p findb --all-targets -- -A clippy::too_many_arguments -A clippy::type_complexity -A clippy::large_enum_variant -A clippy::should_implement_trait -A clippy::field_reassign_with_default
      - name: clippy（全 workspace）
        run: cargo clippy --workspace --all-targets

  # ── 依赖漏洞扫描（cargo-audit 读 Cargo.lock，不编译，秒级） ───────────
  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      # 默认即"发现未修复的 RUSTSEC 漏洞公告 → 失败"；yanked/警告不拦
      - name: cargo audit
        run: cargo audit

  # ── Docker 镜像烟雾测试（防止预取层空占位产物被打进镜像） ────────────
  docker:
    name: Docker image smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: finbook:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 启动并健康检查（真 finweb 才能通过 /api/health）
        run: |
          docker run -d --name finbook-ci -p 127.0.0.1:18080:8080 \
            -e FINBOOK_ADMIN_USER=admin \
            -e FINBOOK_ADMIN_PASS='Admin!2026' \
            finbook:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health | grep -q ok; then
              echo "health ok（第 ${i} 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::容器健康检查失败，输出日志："
          docker logs finbook-ci || true
          exit 1
      - name: 清理
        if: always()
        run: docker rm -f finbook-ci || true

  # ── release 构建产物（Linux x64） ─────────────────────────────────────
  build-linux:
    name: Build (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release
        run: cargo build --release --locked -p finbook -p finweb
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: finbook-linux-x64
          path: |
            target/release/finbook
            target/release/finweb

  # ── release 构建产物（Windows x64，mingw 交叉编译） ──────────────────
  build-windows:
    name: Build (Windows x64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: 安装 mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: 交叉编译 release
        run: cargo build --release --locked --target x86_64-pc-windows-gnu -p finbook -p finweb
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: finbook-windows-x64
          path: |
            target/x86_64-pc-windows-gnu/release/finbook.exe
            target/x86_64-pc-windows-gnu/release/finweb.exe

  # ── Web 端到端（Playwright：真实浏览器 + 真实 finweb 服务） ───────────
  e2e:
    name: Web E2E (Playwright)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建 finweb
        run: cargo build --release --locked -p finweb
      - name: 启动 finweb（临时数据目录）
        run: |
          mkdir -p /tmp/finbook-e2e/data
          nohup env FINBOOK_REALM=/tmp/finbook-e2e/data/realm.db \
            FINBOOK_BOOKS_DIR=/tmp/finbook-e2e/data/books \
            FINBOOK_LISTEN=127.0.0.1:18080 \
            FINWEB_STATIC_DIR="$PWD/crates/finweb/static" \
            FINBOOK_ADMIN_USER=admin \
            FINBOOK_ADMIN_PASS='Admin!2026' \
            ./target/release/finweb > /tmp/finbook-e2e/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::finweb 启动失败"
          cat /tmp/finbook-e2e/server.log
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装 Playwright 与浏览器
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: 运行 E2E
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
        run: npx playwright test
      - name: 失败时输出服务端日志
        if: failure()
        run: tail -120 /tmp/finbook-e2e/server.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: e2e/test-results

  # ── 后端覆盖率（llvm-cov，产出 lcov 报告） ────────────────────────────
  coverage:
    name: Coverage (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: 后端覆盖率（排除桌面 UI，行覆盖门槛 70%）
        run: |
          cargo llvm-cov --workspace \
            --ignore-filename-regex 'crates/(finui|finbook)/' \
            --fail-under-lines 70 \
            --lcov --output-path lcov.info --summary-only
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
