name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 桌面版（Linux x64） ──────────────────────────────────────────────
  desktop-linux:
    name: Desktop (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build desktop
        run: cargo build --release -p finbook
      - name: package
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/finbook-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz" finbook
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/*

  # ── 桌面版（Windows x64，mingw 交叉编译） ────────────────────────────
  desktop-windows:
    name: Desktop (Windows x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: 安装 mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: build desktop
        run: cargo build --release --target x86_64-pc-windows-gnu -p finbook
      - name: package
        run: |
          mkdir -p dist
          zip -j "dist/finbook-${GITHUB_REF_NAME#v}-windows-x86_64.zip" \
            target/x86_64-pc-windows-gnu/release/finbook.exe
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/*

  # ── 汇总并发布到 GitHub Release ─────────────────────────────────────
  publish:
    name: Publish
    needs: [desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成校验和
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: 创建 Release 并上传
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FinBook ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/* \
          || gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
